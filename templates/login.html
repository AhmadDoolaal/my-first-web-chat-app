{% extends "base.html" %}

{% block title%}Login{% endblock%}

{% block content%}
<div class="auth-wrap">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="brand-mark">YT</div>
            <h2>Welcome back</h2>
            <p>Sign in to start chatting in real time.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" placeholder="Enter your username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </div>
    </div>
</div>
{% endblock%}

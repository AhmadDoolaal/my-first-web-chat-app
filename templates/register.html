{% extends "base.html" %}

{% block title%}Register{% endblock%}

{% block content%}
<div class="auth-wrap">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="brand-mark">YT</div>
            <h2>Create account</h2>
            <p>Join the community and start messaging.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" placeholder="Choose a username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="new-password" placeholder="Create a password">
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock%}
